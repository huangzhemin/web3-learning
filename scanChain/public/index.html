<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>区块链扫链演示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .status-scanning { background-color: #ffc107; }
        
        .transaction-item {
            border-left: 4px solid #007bff;
            padding: 10px;
            margin: 5px 0;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        
        .block-item {
            border-left: 4px solid #28a745;
            padding: 10px;
            margin: 5px 0;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        
        .alert-item {
            border-left: 4px solid #dc3545;
            padding: 10px;
            margin: 5px 0;
            background-color: #f8d7da;
            border-radius: 4px;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin: 10px 0;
        }
        
        .real-time-feed {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            background-color: #f8f9fa;
        }
        
        .address-input {
            border-radius: 20px;
            border: 2px solid #e9ecef;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }
        
        .address-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        
        .btn-scan {
            border-radius: 20px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 头部 -->
        <div class="row bg-dark text-white py-3">
            <div class="col-12">
                <h1 class="text-center mb-0">
                    <i class="bi bi-blockchain"></i> 区块链扫链演示
                </h1>
                <p class="text-center text-muted mb-0">实时监控以太坊区块链活动</p>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="row bg-light py-2">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="status-indicator" id="connectionStatus"></span>
                        <span id="connectionText">连接状态</span>
                    </div>
                    <div>
                        <span class="status-indicator" id="scanStatus"></span>
                        <span id="scanText">扫描状态</span>
                    </div>
                    <div>
                        <span id="currentBlock">区块: --</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="row py-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-gear"></i> 扫描控制</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-success btn-scan" id="startScanBtn">
                                <i class="bi bi-play-circle"></i> 开始实时扫描
                            </button>
                            <button class="btn btn-danger btn-scan" id="stopScanBtn" disabled>
                                <i class="bi bi-stop-circle"></i> 停止扫描
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-search"></i> 地址扫描</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group">
                            <input type="text" class="form-control address-input" id="addressInput" 
                                   placeholder="输入以太坊地址 (0x...)">
                            <button class="btn btn-primary btn-scan" id="scanAddressBtn">
                                <i class="bi bi-search"></i> 扫描
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="row">
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="totalBlocks">0</h3>
                    <p class="mb-0">总区块数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="totalTransactions">0</h3>
                    <p class="mb-0">总交易数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="totalAlerts">0</h3>
                    <p class="mb-0">总警报数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="networkStatus">--</h3>
                    <p class="mb-0">网络状态</p>
                </div>
            </div>
        </div>

        <!-- 实时数据流 -->
        <div class="row py-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-activity"></i> 实时区块</h5>
                    </div>
                    <div class="card-body">
                        <div class="real-time-feed" id="blockFeed">
                            <p class="text-muted text-center">等待新区块...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-arrow-left-right"></i> 实时交易</h5>
                    </div>
                    <div class="card-body">
                        <div class="real-time-feed" id="transactionFeed">
                            <p class="text-muted text-center">等待新交易...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 警报和异常 -->
        <div class="row py-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-exclamation-triangle"></i> 安全警报</h5>
                    </div>
                    <div class="card-body">
                        <div class="real-time-feed" id="alertFeed">
                            <p class="text-muted text-center">暂无安全警报</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 地址信息 -->
        <div class="row py-3" id="addressInfoSection" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-person-badge"></i> 地址信息</h5>
                    </div>
                    <div class="card-body" id="addressInfo">
                        <!-- 地址信息将在这里显示 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2 mb-0">正在扫描...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
